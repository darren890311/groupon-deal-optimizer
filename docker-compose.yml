# Local-dev Redis for the analyzer gateway's cache.
# Data persists in the named volume `groupon-redisdata` across container stop/remove.
# Production uses Upstash (serverless Redis); point REDIS_URL there to skip this.
#
#   docker compose up -d      # start
#   docker compose down       # stop (keeps the volume / data)
#   docker compose down -v    # stop AND wipe the data
services:
  redis:
    image: redis:7
    container_name: groupon-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - groupon-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  groupon-redisdata:
