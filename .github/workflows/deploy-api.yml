name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API gateway to Cloud Run
        run: |
          gcloud run deploy groupon-api \
            --source api \
            --project groupon-analyzer-31548 \
            --region us-central1 \
            --memory 512Mi --timeout 300 --max-instances 3 \
            --allow-unauthenticated \
            --set-env-vars "^|^DATABASE_URL=${{ secrets.DATABASE_URL }}|WORKER_URL=https://groupon-worker-xklyudhzbq-uc.a.run.app|ALLOWED_ORIGIN=*" \
            --quiet
