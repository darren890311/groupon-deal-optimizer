name: Deploy worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy worker to Cloud Run (private)
        run: |
          gcloud run deploy groupon-worker \
            --source worker \
            --project groupon-analyzer-31548 \
            --region us-central1 \
            --memory 2Gi --cpu 2 --concurrency 1 --timeout 300 --max-instances 3 \
            --no-allow-unauthenticated \
            --set-env-vars "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }},GOOGLE_PLACES_API_KEY=${{ secrets.GOOGLE_PLACES_API_KEY }}" \
            --quiet
