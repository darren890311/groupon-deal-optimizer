name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        working-directory: web
        env:
          VITE_API_URL: https://groupon-api-xklyudhzbq-uc.a.run.app
        run: |
          npm ci
          npm run build

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Deploy to Firebase Hosting
        working-directory: web
        run: npx firebase-tools deploy --only hosting --project groupon-analyzer-31548 --non-interactive
